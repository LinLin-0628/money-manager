name: CI Pipeline

on:
  push:
    branches:
      - main         # triggers on any push to main
      - '**'         # triggers on push to any branch
  pull_request:

jobs:

  backend-lint:
    name: Backend – Lint & Type Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "backend/pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project dependencies
        run: uv sync --all-groups

      - name: Linting (Ruff)
        run: uv run ruff check .

      - name: Formatting (Ruff)
        run: uv run ruff format . --check --diff

      - name: Run Mypy
        run: uv run mypy .

  backend-unit-test:
    name: Backend – Pytest Tests (Unit Tests)
    runs-on: ubuntu-latest
    needs: backend-lint  # only run tests if linting passes to save compute minutes

    defaults:
      run:
        working-directory: backend

    env:
      DEBUG: false
      ENV: test
      DB_NAME: test_db
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: 5432
      ALGORITHM: HS256
      ACCESS_TOKEN_SECRET: test-secret
      REFRESH_TOKEN_SECRET: test-secret
      REFRESH_TOKEN_HMAC_SECRET: test-secret
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      LOGGING_HMAC_SECRET: test-secret


    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "backend/pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project dependencies
        run: uv sync --all-groups

      - name: Run unit tests with coverage
        run: |
          uv run pytest -m unit \
          --junitxml=pytest.xml \
          --cov-report=term-missing:skip-covered \
          --cov-report=xml \
          --cov-report=html

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage-reports
          path: |
            backend/coverage.xml
            backend/htmlcov/
            backend/pytest.xml
