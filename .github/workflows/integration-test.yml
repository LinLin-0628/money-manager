name: Integration Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:

  backend-integration-test:
    name: Backend – Pytest Tests (Integration Tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DEBUG: false
      DB_NAME: test_db
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: 5432
      ALGORITHM: HS256
      ACCESS_TOKEN_SECRET: test-secret
      REFRESH_TOKEN_SECRET: test-secret
      REFRESH_TOKEN_HMAC_SECRET: test-secret
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      LOGGING_HMAC_SECRET: test-secret

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "backend/pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project dependencies
        run: uv sync --all-groups

      # TODO: Implement database migrations here

      - name: Run integration tests with coverage
        run: |
          uv run pytest -m integration \
          --junitxml=pytest.xml \
          --cov=app \
          --cov-report=term-missing:skip-covered \
          --cov-report=xml \
          --cov-report=html

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-coverage-reports
          path: |
            backend/coverage.xml
            backend/htmlcov/
            backend/pytest.xml
