name: Integration Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:

  backend-integration-test:
    name: Backend – Pytest Tests (Integration Tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    environment: test
    env:
      DEBUG: ${{ secrets.DEBUG }}
      APP_ENV: test
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
      REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
      REFRESH_TOKEN_HMAC_SECRET: ${{ secrets.REFRESH_TOKEN_HMAC_SECRET }}
      LOGGING_HMAC_SECRET: ${{ secrets.LOGGING_HMAC_SECRET }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "backend/pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project dependencies
        run: uv sync --all-groups

      # TODO: Implement database migrations here

      - name: Run integration tests with coverage
        run: |
          uv run pytest -m integration \
          --junitxml=pytest.xml \
          --cov-report=term-missing:skip-covered \
          --cov-report=xml \
          --cov-report=html

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-coverage-reports
          path: |
            backend/coverage.xml
            backend/htmlcov/
            backend/pytest.xml

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: backend/test_logs/
