[project]
name = "fit1045-money-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.0",
    "email-validator>=2.3.0",
    "fastapi>=0.128.0",
    "passlib[argon2,bcrypt]>=1.7.4",
    "psycopg[binary]>=3.3.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-jose[cryptography]>=3.5.0",
    "python-json-logger>=4.0.0",
    "python-multipart>=0.0.21",
    "sqlalchemy>=2.0.45",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "types-passlib>=1.7.7.20250602",
    "types-python-jose>=3.5.0.20250531",
]
format-and-lint = [
    "mypy>=1.19.1",
    "ruff>=0.14.11",
]
other = [
    "pre-commit>=4.5.1",
]
test = [
    "factory-boy>=3.3.3",
    "freezegun>=1.5.5",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
]


# -----------------------------------
# Ruff Configuration
# -----------------------------------

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [
    "migrations"
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "S",
    "T",
    "UP",
    #    "D", # Docstring rules, enable soon
]
ignore = [
    "B008"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105"]
"app/schemas/*" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -----------------------------------
# Mypy Configuration
# -----------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
files = ["app"]
exclude = ["migrations", "tests", "docs"]
plugins = [
    "pydantic.mypy"
]

namespace_packages = true
explicit_package_bases = true

# Strictness flags (already enabled by strict = true, but explicitly listed for clarity)
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false  # FastAPI decorators are untyped
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

# Error messages
show_error_codes = true
show_error_context = true
pretty = true
color_output = true

# Miscellaneous
strict_equality = true
strict_concatenate = true


# Per-module options for third-party libraries without type stubs
[[tool.mypy.overrides]]
module = [
    "uvicorn.*",
    "sqlalchemy.*",
    "alembic.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:passlib.handlers.argon2"
]
